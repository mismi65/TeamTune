<html lang="nl">
<head>
<meta charset="UTF-8">

<meta name="description" content="Neem contact op met TeamTune.">

<meta property="og:title" content="Contact — TeamTune">
<meta property="og:description" content="Neem contact op met TeamTune.">
<meta property="og:image" content="https://teamtune.nl/og-image.png">
<meta property="og:url" content="https://teamtune.nl/contact.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <nav class="site-nav">
    <a href="index.html"><img class="nav-logo" src="logo.png" alt="TeamTune — RealTime Intelligence"></a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="diensten.html">Diensten</a>
      <a href="over-ons.html">Over ons</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>
</header>

<section class="contact-page">
  <div class="wrap">
    <div class="intro">
      <h1>Contact</h1>
    </div>

    <div class="details">
      <a href="mailto:info@teamtune.nl">info@teamtune.nl</a>
      <a href="tel:+31653992476">+31 6 53992476</a>
    </div>

    <form class="contact-form" id="contact-form" action="https://formspree.io/f/xjykwjge" method="POST">
      <label for="name">Naam</label>
      <input type="text" id="name" name="name" required>

      <label for="email">E-mailadres</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Bericht</label>
      <textarea id="message" name="message" required></textarea>

      <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off">

      <button type="submit" id="submit-btn">Versturen</button>
      <p class="form-status" id="form-status"></p>
    </form>
  </div>
</section>

<script>
const form = document.getElementById('contact-form');
const status = document.getElementById('form-status');
const btn = document.getElementById('submit-btn');

form.addEventListener('submit', function(e){
  e.preventDefault();
  btn.disabled = true;
  btn.textContent = 'Versturen…';
  status.className = 'form-status';
  status.textContent = '';

  fetch(form.action, {
    method: 'POST',
    body: new FormData(form),
    headers: { 'Accept': 'application/json' }
  }).then(function(response){
    if (response.ok) {
      status.textContent = 'Bedankt! Je bericht is verzonden, we nemen zo snel mogelijk contact op.';
      status.className = 'form-status success';
      form.reset();
      btn.textContent = 'Versturen';
      btn.disabled = false;
    } else {
      throw new Error('Verzenden mislukt');
    }
  }).catch(function(){
    status.textContent = 'Er ging iets mis bij het verzenden. Probeer het opnieuw, of mail direct naar info@teamtune.nl.';
    status.className = 'form-status error';
    btn.textContent = 'Versturen';
    btn.disabled = false;
  });
});
</script>

<section class="cta-band">
  <div class="wrap">
    <p>Klaar om te zien wat er nú speelt in je team?</p>
    <a class="cta" href="https://teamtune-tech-scan.pages.dev" target="_blank" rel="noopener">Doe de Team Scan</a>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="brand">Team<span>Tune</span></div>
    <div class="contact">
      teamtune.nl &nbsp;|&nbsp;
      <a href="mailto:info@teamtune.nl">info@teamtune.nl</a> &nbsp;|&nbsp;
      <a href="tel:+31653992476">+31 6 53992476</a>
    </div>
  </div>
</footer>

</body>
</html>
